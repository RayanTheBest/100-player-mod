<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spy Satellite Simulator</title>
    <link href="https://cesium.com/downloads/cesiumjs/releases/1.109/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div id="cesiumContainer"></div>

    <div id="ui-panel">
        <h1>SPATIAL OS :: WORLDVIEW</h1>
        <div class="control-group">
            <label for="shaderSelect">VISUAL MODE</label>
            <select id="shaderSelect">
                <option value="default">DEFAULT (EO)</option>
                <option value="nvg">NIGHT VISION (NVG)</option>
                <option value="flir">THERMAL (FLIR)</option>
                <option value="crt">CRT MONITOR</option>
            </select>
        </div>
        <div class="stats">
            <div>SATELLITES TRACKED: <span id="satCount">0</span></div>
            <div>AIRCRAFT TRACKED: <span id="airCount">0</span></div>
        </div>
        <div class="status-box">
            <div class="blink">SYSTEM ONLINE</div>
            <div>DATALINK: ACTIVE</div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cesium.com/downloads/cesiumjs/releases/1.109/Build/Cesium/Cesium.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/satellite.js/4.1.3/satellite.min.js"></script>
    <script src="/static/app.js"></script>
</body>
</html>
